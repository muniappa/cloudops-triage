spring:
  application:
    name: cloudops-triage

  datasource:
    url: jdbc:postgresql://localhost:5432/cloudops
    username: cloudops
    password: cloudops
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns schema creation
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: always       # expose detail in ProblemDetail responses

# Async executor for the agentic incident loop
spring.task.execution:
  pool:
    core-size: 4
    max-size: 16
    queue-capacity: 100
  thread-name-prefix: agentic-loop-

# ── CORS ────────────────────────────────────────────────────────────────────
cloudops:
  cors:
    allowed-origins: http://localhost:5173

# ── Incident advisor ────────────────────────────────────────────────────────
  advisor:
    # Switch between "rule-based" (default) and "llm" without code changes.
    type: rule-based
    llm:
      endpoint: https://api.openai.com/v1/chat/completions
      # Set via environment variable — never commit a real key.
      api-key: ${OPENAI_API_KEY:changeme}
      model: gpt-4o
      timeout: 30s
      max-tokens: 512
      temperature: 0.2

logging:
  level:
    com.cloudops: INFO
    org.hibernate.SQL: WARN
